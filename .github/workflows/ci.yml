name: 'CI'
on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

# A newer push to the same branch or PR makes the running checks moot; every commit on main keeps its result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    strategy:
      matrix:
        node-version:
          - '24'
        platform:
          - ubuntu-latest

    name: Lint
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 20
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'yarn'
          cache-dependency-path: 'yarn.lock'

      - name: Install dependencies
        run: yarn install --immutable

      # node_modules/.cache holds only caches that follow what a result depends on: vue-tsc's build info. eslint and
      # stylelint run without one: they reuse a file's result without tracking everything it depends on. A new entry per
      # passing run, restored from the latest one for the same runner, Node version, yarn.lock and tsconfigs (vue-tsc's build
      # info does not notice a vueCompilerOptions change).
      - name: Restore tool caches
        id: tool-cache
        uses: actions/cache/restore@v6
        with:
          path: node_modules/.cache
          key: tool-cache-v1-${{ runner.os }}-${{ runner.arch }}-node${{ matrix.node-version }}-${{ hashFiles('yarn.lock') }}-${{ hashFiles('tsconfig*.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            tool-cache-v1-${{ runner.os }}-${{ runner.arch }}-node${{ matrix.node-version }}-${{ hashFiles('yarn.lock') }}-${{ hashFiles('tsconfig*.json') }}-

      - name: Run Yarn CI
        run: yarn ci

      # Only after a passing yarn ci, and before the audit, which can fail the job on its own.
      - name: Save tool caches
        uses: actions/cache/save@v6
        with:
          path: node_modules/.cache
          key: ${{ steps.tool-cache.outputs.cache-primary-key }}

      - name: Run Security check
        run: yarn npm audit

  test:
    strategy:
      matrix:
        node-version:
          - '24'
        platform:
          - ubuntu-latest

    name: Test
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 30
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'yarn'
          cache-dependency-path: 'yarn.lock'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> $GITHUB_OUTPUT

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}-${{ hashFiles('yarn.lock') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps

      # The cache holds the browser only; the system libraries it needs are not in it.
      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run tests
        run: yarn test:run
        env:
          CI: true

  # The release workflow is the only other place the library is built: a build that breaks (the
  # declarations included) would otherwise surface only when a release is cut.
  build:
    strategy:
      matrix:
        node-version:
          - '24'
        platform:
          - ubuntu-latest

    name: Build
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 20
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'yarn'
          cache-dependency-path: 'yarn.lock'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build
        run: yarn build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: The build imports only declared packages
        run: node scripts/check-dist-imports.mjs

      - name: The published declarations type-check
        run: node scripts/check-dist-types.mjs

      - name: The stylesheet keeps its cascade layers
        run: node scripts/check-dist-css.mjs
